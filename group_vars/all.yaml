---
# Variables shared across all hosts

# Paths
dotfiles_dir: "{{ ansible_facts.env.HOME }}/.dotfiles"
config_dir: "{{ ansible_facts.env.HOME }}/.config"
xdg_data_home: "{{ ansible_facts.env.HOME }}/.local/share"
local_bin: "{{ ansible_facts.env.HOME }}/.local/bin"

# OS-specific defaults (overridden by group_vars/darwin.yaml or linux.yaml)
# These provide fallback values when running on localhost without explicit group membership
homebrew_prefix: /opt/homebrew
clipboard_cmd: "{{ 'pbcopy' if ansible_facts.os_family == 'Darwin' else 'xclip -in -selection clipboard' }}"
font_dir: "{{ ansible_facts.env.HOME + '/Library/Fonts' if ansible_facts.os_family == 'Darwin' else xdg_data_home + '/fonts' }}"
ghostty_config_dir: "{{ ansible_facts.env.HOME + '/Library/Application Support/com.mitchellh.ghostty' if ansible_facts.os_family == 'Darwin' else config_dir + '/ghostty' }}"

# Git configuration
git_user_name: "Alex Tacescu"
git_user_email: "alextac98@gmail.com"
git_editor: vim

# Default flags
is_work_machine: false
install_gui_apps: true

# Zinit plugins configuration
# Each plugin can have:
#   - repo: (required) Plugin repo or OMZ snippet (e.g., "OMZP::git", "zsh-users/zsh-autosuggestions")
#   - type: "snippet" for OMZ snippets, omit for regular plugins
#   - turbo: true to defer loading until after prompt (recommended for most plugins)
#   - ice: Zinit ice modifiers (e.g., 'atload"!_zsh_autosuggest_start"')
zinit_plugins:
  # OMZ Git plugin (aliases only, no framework overhead)
  - repo: OMZP::git
    type: snippet

  # Syntax highlighting (turbo loaded)
  - repo: zdharma-continuum/fast-syntax-highlighting
    turbo: true
    ice: 'atinit"ZINIT[COMPINIT_OPTS]=-C; zicompinit; zicdreplay"'

  # Autosuggestions (turbo loaded)
  - repo: zsh-users/zsh-autosuggestions
    turbo: true
    ice: 'atload"!_zsh_autosuggest_start"'

  # fzf-tab (turbo loaded)
  - repo: Aloxaf/fzf-tab
    turbo: true
