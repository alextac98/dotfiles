---
# Ghostty terminal configuration (symlinked for live editing)

- name: Ensure Ghostty config directory exists
  file:
    path: "{{ ghostty_config_dir }}"
    state: directory
    mode: '0755'

- name: Symlink Ghostty config
  file:
    src: "{{ dotfiles_dir }}/roles/ghostty/files/config"
    dest: "{{ ghostty_config_dir }}/config"
    state: link
    force: yes
